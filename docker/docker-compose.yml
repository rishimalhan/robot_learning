services:
  robot_learning:
    platform: linux/arm64
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: robot_learning
    privileged: true
    cap_add:
      - NET_ADMIN  # Allow network modifications inside container
    volumes:
      - ..:/robot_learning
    stdin_open: true
    tty: true
    environment:
      - ROS_MASTER_URI=http://localhost:11311
      - ROS_IP=127.0.0.1
      - DISPLAY=:1
      - QT_X11_NO_MITSHM=1
      - QT_QPA_PLATFORM=xcb
      - NO_VNC_PORT=8080
    ports:
      - "8080:8080"   # noVNC web UI
      - "5900:5900"   # VNC
      - "11311:11311" # ROS master
